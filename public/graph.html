<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookings — Timeline</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="top-bar">
  <h1>Room Schedule</h1>
  <div class="top-controls">
    <div class="date-picker">
      <button id="prevDay">‹</button>
      <input type="date" id="dateInput">
      <button id="nextDay">›</button>
      <button id="todayBtn">Today</button>
    </div>
  </div>
</div>
<div class="api-status" id="apiStatus">Connecting…</div>

<div class="layout">
  <div class="panel">
    <h2 id="formTitle">Add booking</h2>
    <div class="field">
      <label>Room</label>
      <select id="fRoom"></select>
    </div>
    <div class="field">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="Team sync">
    </div>
    <div class="field">
      <label>Booked by</label>
      <input type="text" id="fBy" placeholder="Name">
    </div>
    <div class="inline">
      <div class="field">
        <label>Starts</label>
        <input type="time" id="fStart" value="09:00">
      </div>
      <div class="field">
        <label>Ends</label>
        <input type="time" id="fEnd" value="10:00">
      </div>
    </div>
    <button class="primary" id="fSubmit">Add booking</button>
    <button class="secondary" id="fDelete" style="display:none; color:#A23B2E; border-color:#A23B2E;">Delete booking</button>
    <button class="secondary" id="fCancel" style="display:none;">Cancel edit</button>
    <div class="msg" id="fMsg"></div>

    <div class="list-title">Bookings on this day</div>
    <div id="bookingList"></div>
  </div>

  <div class="timeline" id="timeline"></div>
</div>

<script>
  function todayStr() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  const TODAY = todayStr();

  // API base — change this if your server address ever moves.
  const apiBase = "http://127.0.0.1:8000/api";
  let rooms = [];        // [{id, name, capacity, location}]
  let dayBookings = [];  // [{id, room, title, booked_by, starts_at, ends_at}] for the current date, across all rooms
  let currentDate = TODAY;
  let editingId = null;

  const DAY_START = 0;
  const DAY_END = 24;
  const HOUR_HEIGHT = 90;
  const MIN_BLOCK_HEIGHT = 44;

  const timelineEl = document.getElementById("timeline");
  const listEl = document.getElementById("bookingList");
  const roomSelect = document.getElementById("fRoom");
  const msgEl = document.getElementById("fMsg");
  const submitBtn = document.getElementById("fSubmit");
  const cancelBtn = document.getElementById("fCancel");
  const deleteBtn = document.getElementById("fDelete");
  const formTitle = document.getElementById("formTitle");
  const dateInput = document.getElementById("dateInput");
  const apiStatus = document.getElementById("apiStatus");

  dateInput.value = currentDate;

  function timeToMinutes(t) {
    const [h, m] = t.split(":").map(Number);
    return h * 60 + m;
  }

  async function api(path, options) {
    const res = await fetch(apiBase + path, Object.assign({
      headers: { "Content-Type": "application/json", "Accept": "application/json" }
    }, options));
    let body = null;
    try { body = await res.json(); } catch (e) { /* no body */ }
    if (!res.ok) {
      const err = new Error((body && body.message) || ("Request failed (" + res.status + ")"));
      err.body = body;
      throw err;
    }
    return body;
  }

  async function init() {
    apiStatus.textContent = "Connecting…";
    apiStatus.classList.remove("bad");
    try {
      rooms = await api("/rooms");
      roomSelect.innerHTML = rooms.map(r => `<option value="${r.id}">${r.name}</option>`).join("");
      apiStatus.textContent = "Connected — " + rooms.length + " room(s) loaded.";
      await loadDay();
    } catch (e) {
      apiStatus.textContent = "Could not reach API: " + e.message;
      apiStatus.classList.add("bad");
      timelineEl.innerHTML = "";
      listEl.innerHTML = "";
    }
  }

  async function loadDay() {
    if (!rooms.length) return;
    timelineEl.innerHTML = `<div class="empty-day">Loading…</div>`;
    try {
      const results = await Promise.all(
        rooms.map(r => api(`/rooms/${r.id}/schedule/${currentDate}`)
          .then(list => list.map(b => Object.assign({}, b, { room: r.name })))
        )
      );
      dayBookings = results.flat();
      renderTimeline();
      renderList();
    } catch (e) {
      timelineEl.innerHTML = `<div class="empty-day">Could not load schedule: ${e.message}</div>`;
      listEl.innerHTML = "";
    }
  }

  function renderTimeline() {
    let hoursHtml = "";
    for (let h = DAY_START; h <= DAY_END; h++) {
      hoursHtml += `<div class="hour-label"><span class="hour-text">${String(h).padStart(2, "0")}:00</span></div>`;
    }

    let headerHtml = "";
    let roomsHtml = "";
    rooms.forEach(room => {
      headerHtml += `<div class="room-header">${escapeHtml(room.name)}</div>`;

      let gridLines = "";
      for (let h = DAY_START; h <= DAY_END; h++) gridLines += `<div class="grid-line"></div>`;

      const roomBookings = dayBookings.filter(b => b.room === room.name);
      let blocksHtml = "";
      roomBookings.forEach(b => {
        const startMin = timeToMinutes(b.starts_at) - DAY_START * 60;
        const endMin = timeToMinutes(b.ends_at) - DAY_START * 60;
        const top = (startMin / 60) * HOUR_HEIGHT;
        const height = Math.max(((endMin - startMin) / 60) * HOUR_HEIGHT, MIN_BLOCK_HEIGHT);

        blocksHtml += `
          <div class="block" style="top:${top}px; height:${height}px;" data-id="${b.id}">
            <div class="title">${escapeHtml(b.title)}</div>
            <div class="time">${b.starts_at}–${b.ends_at}</div>
            <div class="by">${escapeHtml(b.booked_by)}</div>
          </div>
        `;
      });

      roomsHtml += `
        <div class="room-col">
          <div class="room-body">${gridLines}${blocksHtml}</div>
        </div>
      `;
    });

    timelineEl.innerHTML = `
      <div class="schedule-head">
        <div class="corner-cell"></div>
        ${headerHtml}
      </div>
      <div class="schedule-body">
        <div class="hours">${hoursHtml}</div>
        <div class="rooms">${roomsHtml}</div>
      </div>
    `;

    timelineEl.querySelectorAll(".block").forEach(el => {
      el.addEventListener("click", () => startEdit(el.dataset.id));
    });
  }

  function renderList() {
    if (!dayBookings.length) {
      listEl.innerHTML = `<div class="empty-day">No bookings on this day.</div>`;
      return;
    }
    listEl.innerHTML = dayBookings
      .slice()
      .sort((a, b) => a.room.localeCompare(b.room) || timeToMinutes(a.starts_at) - timeToMinutes(b.starts_at))
      .map(b => `
        <div class="booking-row">
          <div class="info">${escapeHtml(b.room)} — ${escapeHtml(b.title)} (${b.starts_at}–${b.ends_at})</div>
        </div>
      `).join("");
  }

  function goToDate(dateStr) {
    currentDate = dateStr;
    dateInput.value = dateStr;
    loadDay();
  }

  dateInput.addEventListener("change", () => goToDate(dateInput.value));

  document.getElementById("prevDay").addEventListener("click", () => {
    const d = new Date(currentDate + "T00:00:00");
    d.setDate(d.getDate() - 1);
    goToDate(d.toISOString().slice(0, 10));
  });
  document.getElementById("nextDay").addEventListener("click", () => {
    const d = new Date(currentDate + "T00:00:00");
    d.setDate(d.getDate() + 1);
    goToDate(d.toISOString().slice(0, 10));
  });
  document.getElementById("todayBtn").addEventListener("click", () => goToDate(TODAY));

  function startEdit(id) {
    const b = dayBookings.find(x => String(x.id) === String(id));
    if (!b) return;
    const room = rooms.find(r => r.name === b.room);
    editingId = id;
    if (room) roomSelect.value = room.id;
    document.getElementById("fTitle").value = b.title;
    document.getElementById("fBy").value = b.booked_by;
    document.getElementById("fStart").value = b.starts_at;
    document.getElementById("fEnd").value = b.ends_at;
    formTitle.textContent = "Edit booking";
    submitBtn.textContent = "Save changes";
    cancelBtn.style.display = "block";
    deleteBtn.style.display = "block";
    msgEl.textContent = "";
  }

  function resetForm() {
    editingId = null;
    document.getElementById("fTitle").value = "";
    document.getElementById("fBy").value = "";
    document.getElementById("fStart").value = "09:00";
    document.getElementById("fEnd").value = "10:00";
    formTitle.textContent = "Add booking";
    submitBtn.textContent = "Add booking";
    cancelBtn.style.display = "none";
    deleteBtn.style.display = "none";
    msgEl.textContent = "";
  }

  cancelBtn.addEventListener("click", resetForm);

  deleteBtn.addEventListener("click", async () => {
    if (!editingId) return;
    if (!confirm("Delete this booking?")) return;
    deleteBtn.disabled = true;
    try {
      await api(`/bookings/${editingId}`, { method: "DELETE" });
      resetForm();
      await loadDay();
    } catch (e) {
      msgEl.textContent = e.message;
    } finally {
      deleteBtn.disabled = false;
    }
  });

  submitBtn.addEventListener("click", async () => {
    const roomId = roomSelect.value;
    const title = document.getElementById("fTitle").value.trim();
    const by = document.getElementById("fBy").value.trim();
    const start = document.getElementById("fStart").value;
    const end = document.getElementById("fEnd").value;

    msgEl.textContent = "";
    if (!roomId || !title || !by || !start || !end) {
      msgEl.textContent = "Fill in every field.";
      return;
    }
    if (timeToMinutes(start) >= timeToMinutes(end)) {
      msgEl.textContent = "Start must be before end.";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = editingId ? "Saving…" : "Booking…";
    try {
      const payload = {
        room_id: roomId,
        title: title,
        booked_by: by,
        starts_at: `${currentDate} ${start}:00`,
        ends_at: `${currentDate} ${end}:00`
      };
      if (editingId) {
        await api(`/bookings/${editingId}`, { method: "PUT", body: JSON.stringify(payload) });
      } else {
        await api("/bookings", { method: "POST", body: JSON.stringify(payload) });
      }
      resetForm();
      await loadDay();
    } catch (e) {
      let text = e.message;
      if (e.body && e.body.errors) {
        text = Object.values(e.body.errors).flat().join(" ");
      }
      msgEl.textContent = text;
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = editingId ? "Save changes" : "Add booking";
    }
  });

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  init();
</script>

</body>
</html>
